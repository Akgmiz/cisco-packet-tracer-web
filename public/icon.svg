<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Subtle border outline -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Network Topology Cables / Circuit Lines -->
  <!-- Center to Top -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="256" x2="256" y2="120" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Center to Bottom Left -->
  <line x1="256" y1="256" x2="130" y2="370" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="256" x2="130" y2="370" stroke="#818cf8" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Center to Bottom Right -->
  <line x1="256" y1="256" x2="382" y2="370" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="256" x2="382" y2="370" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Horizontal cross link -->
  <line x1="130" y1="370" x2="382" y2="370" stroke="#334155" stroke-width="4" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Top Node (Gateway Router) -->
  <g transform="translate(256, 120)" filter="url(#glow-blur)">
    <circle r="44" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle r="20" fill="url(#cyan-glow)"/>
    <circle r="6" fill="#ffffff"/>
  </g>

  <!-- Bottom-Left Node (Workstation PC) -->
  <g transform="translate(130, 370)" filter="url(#glow-blur)">
    <circle r="40" fill="#0f172a" stroke="#818cf8" stroke-width="4"/>
    <circle r="18" fill="url(#indigo-glow)"/>
    <circle r="5" fill="#ffffff"/>
  </g>

  <!-- Bottom-Right Node (Server Node) -->
  <g transform="translate(382, 370)" filter="url(#glow-blur)">
    <circle r="40" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
    <circle r="18" fill="url(#emerald-glow)"/>
    <circle r="5" fill="#ffffff"/>
  </g>

  <!-- Central Switch Core Node -->
  <g transform="translate(256, 256)" filter="url(#glow-blur)">
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
    <circle r="18" fill="url(#cyan-glow)"/>
    <circle r="6" fill="#ffffff"/>
    <!-- Small indicator LEDs -->
    <circle cx="-20" cy="-20" r="3.5" fill="#34d399"/>
    <circle cx="-10" cy="-20" r="3.5" fill="#38bdf8"/>
    <circle cx="0" cy="-20" r="3.5" fill="#38bdf8"/>
    <circle cx="10" cy="-20" r="3.5" fill="#34d399"/>
    <circle cx="20" cy="-20" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- Traveling Glowing ICMP Packet -->
  <circle cx="256" cy="180" r="7" fill="#ffffff" filter="url(#glow-blur)"/>
  <circle cx="200" cy="305" r="6" fill="#38bdf8" filter="url(#glow-blur)"/>
</svg>
